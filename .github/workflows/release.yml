name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    # Enable after provisioning the signing, notarization, and Sparkle secrets.
    if: vars.ENABLE_SIGNED_RELEASES == 'true'
    name: Signed macOS release
    runs-on: macos-15
    timeout-minutes: 45

    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DEVELOPER_ID_APPLICATION
            DEVELOPER_ID_CERTIFICATE_BASE64
            DEVELOPER_ID_CERTIFICATE_PASSWORD
            DEVELOPMENT_TEAM
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
            APPLE_API_PRIVATE_KEY
            SPARKLE_PUBLIC_ED_KEY
            SPARKLE_PRIVATE_ED_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 2
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ArxivResearch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/DeveloperID.p12"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Build and sign app
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$APP_VERSION" \
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION" \
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
          SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
          ./scripts/build-app-bundle.sh

      - name: Notarize and staple
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/.build/release/ArxivResearch.app"
          NOTARY_ARCHIVE="$RUNNER_TEMP/ArxivResearch-notarize.zip"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ARCHIVE"
          xcrun notarytool submit "$NOTARY_ARCHIVE" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create signed archive and appcast
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_BASENAME="ArxivResearch-v${APP_VERSION}-macos-arm64"
          UPDATES_DIR="$RUNNER_TEMP/updates"
          mkdir -p "$UPDATES_DIR"
          ditto -c -k --keepParent \
            "$GITHUB_WORKSPACE/.build/release/ArxivResearch.app" \
            "$UPDATES_DIR/$RELEASE_BASENAME.zip"
          NOTES_PATH="$GITHUB_WORKSPACE/docs/releases/v${APP_VERSION}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            cp "$NOTES_PATH" "$UPDATES_DIR/$RELEASE_BASENAME.md"
          fi
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | \
            "$GITHUB_WORKSPACE/.build/artifacts/sparkle/Sparkle/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
              --embed-release-notes \
              "$UPDATES_DIR"
          mkdir -p "$GITHUB_WORKSPACE/.build/release-assets"
          cp "$UPDATES_DIR/$RELEASE_BASENAME.zip" "$GITHUB_WORKSPACE/.build/release-assets/"
          cp "$UPDATES_DIR/appcast.xml" "$GITHUB_WORKSPACE/.build/release-assets/"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="${GITHUB_REF_NAME#v}"
          NOTES_PATH="docs/releases/v${APP_VERSION}.md"
          if [[ -f "$NOTES_PATH" ]]; then
            gh release create "$GITHUB_REF_NAME" .build/release-assets/* \
              --title "ArxivResearch $GITHUB_REF_NAME" \
              --notes-file "$NOTES_PATH"
          else
            gh release create "$GITHUB_REF_NAME" .build/release-assets/* \
              --title "ArxivResearch $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ArxivResearch-signing.keychain-db" || true
