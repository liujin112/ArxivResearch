name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: SwiftPM
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app products
        run: |
          swift build --product ArxivResearchApp
          swift build --product ArxivResearchHelper
          swift build --product ArxivResearchMobileApp

      - name: Test
        run: swift test

      - name: Whitespace check
        run: git diff --check
